name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Bật BuildKit — bắt buộc để dùng cache-from/cache-to
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache-from: Lấy layer đã build từ lần trước trên GitHub Cache Registry
      # cache-to:   Lưu layer mới build vào cache để lần sau dùng lại
      # mode=max:   Cache tất cả các intermediate layer (không chỉ final image)
      # → Khi pom.xml không đổi, bước `mvn package` bên trong Dockerfile
      #   sẽ được lấy từ cache, tiết kiệm 2-5 phút build.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:cache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:cache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/backend_deploy_key
          chmod 600 ~/.ssh/backend_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/backend_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/backend && \
             BACKEND_IMAGE='$BACKEND_IMAGE' IMAGE_TAG='$IMAGE_TAG' docker compose pull backend && \
             BACKEND_IMAGE='$BACKEND_IMAGE' IMAGE_TAG='$IMAGE_TAG' docker compose up -d --wait --wait-timeout 180 backend"
