spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5000ms
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200 # 1 hour
  refresh-token-expiration: 604800 # 7 days

server:
  servlet:
    context-path: /api/v1

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET}

outbox:
  publisher:
    fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}

security:
  hmac:
    enabled: true
    header:
      api-key: X-Api-Key
      timestamp: X-Timestamp
      nonce: X-Nonce
      signature: X-Signature
    algorithm: HmacSHA256
    clock-skew: 300s
    nonce-ttl: 300s
    cache-ttl: 30m
    negative-cache-ttl: 60s
    max-body-size: 262144
    protected-paths:
      - /ack
      - /*/transactions/sended/**
      - /*/transactions/received
    master-key: ${HMAC_MASTER_KEY:dev-local-master-key-change-in-production}

app:
  client-simulator:
    gateway-url: ${CLIENT_SIMULATOR_GATEWAY_URL:http://localhost:8080/api/v1/exchange}
